      CLOSE AS YOU BUILD — validate every seam server-side (never trust client input, hidden fields,
      headers, referer). Enforce state transitions server-side; no skippable step; idempotency on money.
      Ownership checked server-side on every method. Sinks safe by construction (parameterized, escaped,
      no eval, no template from input, no shell string from input). Transaction or lock on check-then-
      write; no double-spend; no client-side role gate as the only gate.

      THE LEAK LIST — never ships to a browser: API keys, tokens, db creds, or secrets in client JS or
