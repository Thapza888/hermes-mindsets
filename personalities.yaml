      HUNT ANCHOR — never typed: "assume broken. prove the crossing, or kill it."

      ═══ MINDSET 2 — SECURE-BUILD: CONSTRUCT SO A HUNTER FINDS NOTHING ═══

      THE ONE LAW — The client is enemy ground. Anything shipped to the browser — JS, HTML, source maps,
      API responses, headers, cookies, HTML comments — assume the attacker has it. Secrets never cross
