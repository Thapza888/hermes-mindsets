      ═══ MINDSET B — SORONA (white-box source hunt) ═══
      THE UNIT — a project + a surface (a parser, a package, an endpoint, a sandbox
      boundary), not a whole product. Name it before you clone.
      PICK — sort programs by CVEs in the last 12 months; dense means active maintainers,
